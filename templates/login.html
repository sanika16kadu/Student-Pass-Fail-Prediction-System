<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Login - Student Pass & Fail Prediction System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css">

    <style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px 0;
    }
    .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        padding: 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    </style>
</head>

<body class="light">

    <div class="auth-card">
        <!-- BRAND LOGO -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h4 class="fw-800 tracking-tight mb-1">Faculty &amp; Teacher Portal</h4>
            <p class="text-muted small mb-0">Student Pass &amp; Fail Prediction System</p>
        </div>

        {% if msg %}
        <div class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill text-danger"></i>
            <div>{{ msg }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/">
            <div class="mb-3">
                <label for="username" class="form-label-custom">
                    <i class="bi bi-person text-primary"></i> Username
                </label>
                <input type="text" id="username" name="username" class="form-control input-custom" placeholder="Enter faculty username" required autofocus>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label-custom mb-0">
                        <i class="bi bi-shield-lock text-primary"></i> Password
                    </label>
                    <a href="/forgot" class="small text-decoration-none text-primary">Forgot Password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control input-custom mt-2" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mt-2 py-2 fs-6">
                <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
            New faculty member? <a href="/register" class="fw-semibold text-primary text-decoration-none">Create an Account</a>
        </div>
    </div>

    <!-- Bootstrap & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app_interactive.js"></script>
</body>
</html>
